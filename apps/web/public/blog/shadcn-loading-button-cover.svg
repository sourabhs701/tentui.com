<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="1110" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101728"/>
      <stop offset="0.52" stop-color="#090D16"/>
      <stop offset="1" stop-color="#080A0F"/>
    </linearGradient>
    <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientTransform="translate(903 286) rotate(149) scale(475 375)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="translate(1115 85) rotate(131) scale(350 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="soft-light"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <rect width="1200" height="630" fill="url(#blue-glow)"/>
    <rect width="1200" height="630" fill="url(#violet-glow)"/>

    <g transform="translate(68 64)">
      <rect width="132" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="17" cy="15" r="5" fill="#60A5FA"/>
      <text x="31" y="20" fill="#D8E7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.3">TENTUI LAB</text>
    </g>

    <text x="68" y="192" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="61" letter-spacing="-2.2">
      <tspan x="68" dy="0">A loading button</tspan>
      <tspan x="68" dy="72">is a state machine.</tspan>
    </text>

    <text x="72" y="339" fill="#9CA9BE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" letter-spacing="0.1">
      Loading, success, and error states for shadcn.
    </text>

    <g transform="translate(68 403)" filter="url(#shadow)">
      <rect width="184" height="58" rx="29" fill="url(#button)"/>
      <text x="92" y="36" text-anchor="middle" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Save changes</text>
    </g>

    <g transform="translate(276 403)">
      <path d="M0 29H36" stroke="#6B7890" stroke-width="1.5" stroke-dasharray="4 5"/>
      <path d="M31 24L36 29L31 34" stroke="#6B7890" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(336 403)" filter="url(#shadow)">
      <rect width="154" height="58" rx="29" fill="#1B2331" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="35" cy="29" r="9" stroke="#93A2B8" stroke-opacity="0.28" stroke-width="2.5"/>
      <path d="M35 20A9 9 0 0 1 44 29" stroke="#DCE7F7" stroke-width="2.5" stroke-linecap="round"/>
      <text x="91" y="35" text-anchor="middle" fill="#C9D4E4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Saving</text>
    </g>

    <g transform="translate(514 403)">
      <path d="M0 29H36" stroke="#6B7890" stroke-width="1.5" stroke-dasharray="4 5"/>
      <path d="M31 24L36 29L31 34" stroke="#6B7890" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(574 376)">
