    <text x="72" y="583" fill="#5E6B7F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.2">TENTUI.COM / COPY THE SOURCE, OWN THE BEHAVIOR</text>
  </g>
