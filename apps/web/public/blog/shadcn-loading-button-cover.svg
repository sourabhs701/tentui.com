        <g transform="translate(0 67)">
          <circle cx="6" cy="6" r="6" fill="#8B5CF6" fill-opacity="0.22"/>
          <circle cx="6" cy="6" r="2" fill="#A78BFA"/>
          <text x="22" y="10" fill="#AAB6C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Announces live status</text>
        </g>
        <g transform="translate(0 105)">
          <circle cx="6" cy="6" r="6" fill="#22C55E" fill-opacity="0.2"/>
          <circle cx="6" cy="6" r="2" fill="#4ADE80"/>
          <text x="22" y="10" fill="#AAB6C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Respects reduced motion</text>
        </g>
      </g>
