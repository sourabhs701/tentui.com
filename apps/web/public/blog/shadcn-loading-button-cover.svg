        <rect width="142" height="58" rx="29" fill="#14271F" stroke="#4ADE80" stroke-opacity="0.28"/>
        <circle cx="34" cy="29" r="11" fill="#22C55E"/>
        <path d="M29 29L33 33L40 25" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="89" y="35" text-anchor="middle" fill="#D6F9E2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Saved</text>
      </g>
      <text x="71" y="-13" text-anchor="middle" fill="#68D391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="1.5">RESOLVES</text>
    </g>

    <g transform="translate(574 460)">
      <g filter="url(#shadow)">
        <rect width="142" height="58" rx="29" fill="#2A171B" stroke="#F87171" stroke-opacity="0.3"/>
        <circle cx="34" cy="29" r="11" fill="#EF4444"/>
        <path d="M30 25L38 33M38 25L30 33" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <text x="91" y="35" text-anchor="middle" fill="#FFE0E0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Retry</text>
      </g>
      <text x="71" y="78" text-anchor="middle" fill="#F29393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="1.5">REJECTS</text>
    </g>

    <g transform="translate(775 88)">
      <rect width="354" height="474" rx="30" fill="#0B101A" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="30" cy="30" r="4" fill="#EF4444" fill-opacity="0.75"/>
      <circle cx="46" cy="30" r="4" fill="#F59E0B" fill-opacity="0.75"/>
      <circle cx="62" cy="30" r="4" fill="#22C55E" fill-opacity="0.75"/>
      <text x="177" y="34" text-anchor="middle" fill="#738096" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4">ASYNC ACTION / 01</text>
      <path d="M24 62H330" stroke="#FFFFFF" stroke-opacity="0.08"/>

      <g transform="translate(37 100)">
        <text x="0" y="12" fill="#69768A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.5">STATUS</text>
        <text x="0" y="52" fill="#EDF3FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="620">idle</text>
        <rect x="214" y="25" width="64" height="28" rx="14" fill="#172239"/>
        <text x="246" y="44" text-anchor="middle" fill="#79AFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">READY</text>
      </g>

      <g transform="translate(37 196)">
        <text x="0" y="12" fill="#69768A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.5">TRANSITIONS</text>
        <path d="M12 57H74M116 57H178M220 57H278" stroke="#536178" stroke-width="1.5" stroke-dasharray="3 5"/>
        <circle cx="12" cy="57" r="8" fill="#3B82F6"/>
        <circle cx="95" cy="57" r="8" fill="#7C89A0"/>
        <circle cx="199" cy="57" r="8" fill="#22C55E"/>
        <circle cx="298" cy="57" r="8" fill="#EF4444"/>
        <text x="12" y="84" text-anchor="middle" fill="#99A6B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">IDLE</text>
        <text x="95" y="84" text-anchor="middle" fill="#99A6B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">LOAD</text>
        <text x="199" y="84" text-anchor="middle" fill="#99A6B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">DONE</text>
        <text x="298" y="84" text-anchor="middle" fill="#99A6B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">ERROR</text>
      </g>

      <g transform="translate(37 327)">
        <path d="M0 0H280" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <g transform="translate(0 29)">
          <circle cx="6" cy="6" r="6" fill="#3B82F6" fill-opacity="0.22"/>
          <circle cx="6" cy="6" r="2" fill="#60A5FA"/>
          <text x="22" y="10" fill="#AAB6C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Locks duplicate actions</text>
