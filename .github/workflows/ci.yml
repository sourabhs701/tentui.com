name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm check-types

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tentui.com
    # Never cancel a deploy halfway; queue the next one instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both deploy scripts read packages/env/.env.prod, so recreate it from
      # the ENV_PROD secret (the full contents of your local .env.prod).
      - name: Write .env.prod
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          if [ -z "$ENV_PROD" ]; then
            echo "::error::ENV_PROD secret is not set"
            exit 1
          fi
          printf '%s\n' "$ENV_PROD" > packages/env/.env.prod
          for key in ALCHEMY_PASSWORD ALCHEMY_STATE_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            grep -q "^$key=." packages/env/.env.prod || { echo "::error::ENV_PROD is missing $key"; exit 1; }
          done

      # Server (Alchemy) deploys first, then web (OpenNext) via turbo's dependsOn.
      - name: Deploy
        run: pnpm run deploy
